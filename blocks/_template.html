<!--
  Block skeleton voor Claude Blocks.
  Vervang {{slug}} door de daadwerkelijke slug (lowercase, hyphens).
-->

<div class="cb-{{slug}}">
<style>
.cb-{{slug}}, .cb-{{slug}} *, .cb-{{slug}} *::before, .cb-{{slug}} *::after { all: revert; box-sizing: border-box; }
.cb-{{slug}} { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; color: #111; line-height: 1.6; max-width: 1200px; margin: 0 auto; padding: 48px 24px; }
.cb-{{slug}} h1 { font-size: clamp(32px, 5vw, 56px); font-weight: 700; line-height: 1.1; margin: 0 0 24px; letter-spacing: -0.02em; }
.cb-{{slug}} h2 { font-size: clamp(24px, 3vw, 36px); font-weight: 600; line-height: 1.2; margin: 48px 0 16px; letter-spacing: -0.01em; }
.cb-{{slug}} p { font-size: 18px; margin: 0 0 16px; }
.cb-{{slug}} a { color: #0066ff; text-decoration: underline; text-underline-offset: 3px; }
.cb-{{slug}} .cb-button { display: inline-block; background: #111; color: #fff; padding: 14px 28px; border-radius: 8px; font-weight: 600; text-decoration: none; margin-top: 16px; }
.cb-{{slug}} .cb-button:hover { background: #333; }
@media (max-width: 640px) { .cb-{{slug}} { padding: 32px 16px; } }
</style>

<!-- BLOCK CONTENT START -->
<h1>Block titel</h1>
<p class="lead">Korte intro die de toon zet.</p>
<h2>Sectie</h2>
<p>Body content hier.</p>
<a href="#" class="cb-button">Call to action</a>
<!-- BLOCK CONTENT END -->

</div>
