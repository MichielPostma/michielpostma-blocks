<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Claude Blocks</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 64px auto; padding: 0 24px; color: #222; }
  h1 { letter-spacing: -0.02em; }
  code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; }
  ul { padding-left: 20px; }
</style>
</head>
<body>
<h1>Claude Blocks</h1>
<p>Statische HTML-blocks die via de WP-plugin <code>claude-blocks</code> in WordPress-pagina's worden ingebed.</p>
<p>Beschikbare blocks staan onder <code>/blocks/&lt;slug&gt;.html</code>.</p>
<p>Repo-management: pushes naar <code>main</code> deployen automatisch via Netlify.</p>
</body>
</html>
